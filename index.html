        // ระบบแปลข้อมูล CSV สำรอง
        function parseFallbackCSV(csvString) {
            const lines = csvString.trim().split('\n');
            let monthly = {};

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length < 5 || !row[0]) continue;

                // รองรับ Date แบบ MM/DD/YYYY
                const dateParts = row[0].split('/');
                if(dateParts.length !== 3) continue;
                const monthLabel = `${dateParts[2]}-${dateParts[0].padStart(2, '0')}`;
                
                const close = parseFloat(row[1]);
                const open = parseFloat(row[3]);
                const high = parseFloat(row[4]);
                const low = parseFloat(row[5]);

                if (!monthly[monthLabel]) {
                    monthly[monthLabel] = {
                        date: monthLabel,
                        isFirstOfYear: dateParts[0] === '01',
                        open: open, high: high, low: low, close: close
                    };
                } else {
                    monthly[monthLabel].high = Math.max(monthly[monthLabel].high, high);
                    monthly[monthLabel].low = Math.min(monthly[monthLabel].low, low);
                    monthly[monthLabel].close = close; // วันสุดท้ายของเดือนจะได้ค่า close สุดท้าย
                }
            }
            
            // สำคัญ: ต้อง Sort ข้อมูลจาก อดีต -> ปัจจุบัน เสมอ!
            return Object.values(monthly).sort((a, b) => a.date.localeCompare(b.date));
        }

        // 2. Data Fetcher (Smart Fetch + Fallback)
        async function fetchAndParseData() {
            try {
                // พยายามดึงสดก่อน
                const targetUrl = encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/VOO?interval=1d&range=15y');
                const response = await fetch(`https://api.allorigins.win/raw?url=${targetUrl}`);
                
                if (!response.ok) throw new Error('Proxy HTTP Error');
                
                const data = await response.json();
                
                // ตรวจสอบว่าโครงสร้าง JSON ถูกต้องไหม (ถ้า Proxy โดนแบน มันจะส่งกลับมาเป็นหน้า HTML พังๆ)
                if (!data || !data.chart || !data.chart.result || !data.chart.result[0]) {
                    throw new Error('Invalid JSON Structure from Proxy');
                }

                const result = data.chart.result[0];
                const timestamps = result.timestamp;
                const quote = result.indicators.quote[0];
                const adjclose = result.indicators.adjclose ? result.indicators.adjclose[0].adjclose : quote.close;

                let monthly = {};

                for (let i = 0; i < timestamps.length; i++) {
                    if (quote.open[i] === null) continue; 

                    const dateObj = new Date(timestamps[i] * 1000);
                    const year = dateObj.getFullYear();
                    const monthNum = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const monthLabel = `${year}-${monthNum}`;
                    
                    if (year < 2015) continue;

                    const open = quote.open[i];
                    const high = quote.high[i];
                    const low = quote.low[i];
                    const close = adjclose[i];

                    if (!monthly[monthLabel]) {
                        monthly[monthLabel] = {
                            date: monthLabel,
                            isFirstOfYear: monthNum === '01',
                            open: open, high: high, low: low, close: close
                        };
                    } else {
                        monthly[monthLabel].high = Math.max(monthly[monthLabel].high, high);
                        monthly[monthLabel].low = Math.min(monthly[monthLabel].low, low);
                        monthly[monthLabel].close = close; 
                    }
                }
                
                // แจ้งว่าสำเร็จ
                const loadBox = document.getElementById('loadingBox');
                loadBox.className = "bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl mb-6 text-center transition-all";
                loadBox.innerText = "✅ ดึงข้อมูลล่าสุดจากตลาดหุ้นสำเร็จ!";
                setTimeout(() => loadBox.style.display = 'none', 1500);

                return Object.values(monthly);

            } catch (error) {
                // ⚠️ ถ้าพัง! ไม่ว่าจะด้วยสาเหตุอะไรก็ตาม ให้ตกมาตรงนี้ (Graceful Degradation)
                console.warn("API ยิงไม่เข้า เปลี่ยนไปใช้ข้อมูลสำรอง (Fallback) แทน", error);
                
                const loadBox = document.getElementById('loadingBox');
                loadBox.className = "bg-orange-50 border border-orange-200 text-orange-700 px-4 py-3 rounded-xl mb-6 text-center transition-all";
                loadBox.innerHTML = "⚠️ ไม่สามารถดึงข้อมูลสดได้ <b>ระบบกำลังใช้ข้อมูลสำรองแทน (ถึง ต.ค. 2026)</b>";
                
                // ใช้ข้อมูล CSV สมมติที่เตรียมไว้แทน เพื่อให้เว็บเล่นได้ 100%
                return parseFallbackCSV(FALLBACK_CSV);
            }
        }

        let vooData = [];

        // 3. State & Formatters
        const fmtTHB = (n) => "฿" + Math.round(n).toLocaleString("th-TH");
        const colors = { lumpSum: '#8B5CF6', dcaFirst: '#3B82F6', dcaLow: '#10B981', dcaHigh: '#EF4444', cash: '#64748B' };
        let chartInstance = null;

        // 4. Core Backtest Engine
        function runBacktest(yearlyDca) {
            const monthlyDca = yearlyDca / 12;
            let history = [];
            
            let pLump = { shares: 0, cost: 0 };
            let pFirst = { shares: 0, cost: 0 };
            let pLow = { shares: 0, cost: 0 };
            let pHigh = { shares: 0, cost: 0 };
            let pCash = { value: 0 }; 
            
            const monthlyInflationRate = 0.03 / 12; // เงินเฟ้อ 3% ต่อปี

            vooData.forEach(d => {
                pCash.value = (pCash.value * (1 - monthlyInflationRate)) + monthlyDca;

                if (d.isFirstOfYear) {
                    pLump.shares += yearlyDca / d.open;
                    pLump.cost += yearlyDca;
                }
                
                pFirst.shares += monthlyDca / d.open;
                pFirst.cost += monthlyDca;

                pLow.shares += monthlyDca / d.low;
                pLow.cost += monthlyDca;

                pHigh.shares += monthlyDca / d.high;
                pHigh.cost += monthlyDca;

                history.push({
                    date: d.date,
                    cost: pFirst.cost,
                    lumpSum: pLump.shares * d.close,
                    dcaFirst: pFirst.shares * d.close,
                    dcaLow: pLow.shares * d.close,
                    dcaHigh: pHigh.shares * d.close,
                    cashValue: pCash.value
                });
            });

            return { history, totalCost: pFirst.cost };
        }

        // 5. UI Updater
        function updateUI() {
            const yearlyDca = Number(document.getElementById('dcaSlider').value);
            document.getElementById('yearlyText').innerText = fmtTHB(yearlyDca) + " / ปี";
            document.getElementById('monthlyText').innerText = "ตกเดือนละ " + fmtTHB(yearlyDca/12);

            if(vooData.length === 0) return; // ข้อมูลยังไม่มา

            const { history, totalCost } = runBacktest(yearlyDca);
            const last = history[history.length - 1];
            document.getElementById('chartTitle').innerText = `การเติบโตของพอร์ตเทียบกับต้นทุน (ทุนรวม: ${fmtTHB(totalCost)})`;

            // วาด Cards (เพิ่มวิธีเก็บเงินสด)
            const results = [
                { name: "ซื้อต่ำสุดทุกเดือน", val: last.dcaLow, c: colors.dcaLow, desc: "จับจังหวะแบบพระเจ้า" },
                { name: "ทุ่มก้อนเดียวต้นปี", val: last.lumpSum, c: colors.lumpSum, desc: "เงินก้อนพร้อมตั้งแต่ ม.ค." },
                { name: "DCA ต้นเดือน", val: last.dcaFirst, c: colors.dcaFirst, desc: "หลับตาซื้อทุกวันที่ 1" },
                { name: "ซื้อแพงสุดทุกเดือน", val: last.dcaHigh, c: colors.dcaHigh, desc: "ซวยจัด ซื้อแพงสุดตลอด" },
                { name: "เก็บเงินสดฝังตุ่ม", val: last.cashValue, c: colors.cash, desc: "เงินเฟ้อ 3% กัดกินมูลค่า" }
            ].sort((a, b) => b.val - a.val);

            let cardsHTML = '';
            results.forEach((r, idx) => {
                const profit = r.val - totalCost;
                const percent = ((profit / totalCost) * 100).toFixed(2);
                const pColor = profit >= 0 ? 'text-green-600' : 'text-red-600';
                
                cardsHTML += `
                    <div class="bg-white rounded-xl p-4 shadow-sm border-t-4 flex flex-col justify-between" style="border-color: ${r.c}">
                        <div>
                            <div class="text-[11px] font-bold text-slate-500 mb-1">อันดับ ${idx+1}: ${r.name}</div>
                            <div class="text-lg font-black text-slate-800 my-1">${fmtTHB(r.val)}</div>
                        </div>
                        <div>
                            <div class="text-sm font-bold ${pColor}">กำไร ${fmtTHB(profit)}</div>
                            <div class="text-[11px] font-bold ${pColor}">(${profit >= 0 ? '+' : ''}${percent}%)</div>
                            <div class="text-[10px] text-slate-400 mt-1 leading-tight">${r.desc}</div>
                        </div>
                    </div>
                `;
            });
            // ปรับตารางการ์ดให้รองรับ 5 กล่องพอดี
            document.getElementById('summaryCards').className = "grid grid-cols-2 md:grid-cols-5 gap-4 mb-6";
            document.getElementById('summaryCards').innerHTML = cardsHTML;

            // วาด Chart
            const labels = history.map(h => h.date);
            const datasets = [
                { label: 'ต้นทุนสะสม (เงินก้อน)', data: history.map(h => h.cost), borderColor: '#CBD5E1', borderDash: [5,5], fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'เก็บเงินสด (โดนเงินเฟ้อ)', data: history.map(h => h.cashValue), borderColor: colors.cash, fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'Lump Sum (ต้นปี)', data: history.map(h => h.lumpSum), borderColor: colors.lumpSum, fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'DCA (ต้นเดือน)', data: history.map(h => h.dcaFirst), borderColor: colors.dcaFirst, fill: false, tension: 0.1, pointRadius: 0 },
                
                // ปิดเส้นที่ทำให้กราฟดูรกไว้ก่อน (User กดเปิดได้ที่คำบรรยายบนกราฟ)
                { label: 'DCA (ต่ำสุดของเดือน)', data: history.map(h => h.dcaLow), borderColor: colors.dcaLow, borderDash: [2,2], fill: false, tension: 0.1, pointRadius: 0, hidden: true },
                { label: 'DCA (สูงสุดของเดือน)', data: history.map(h => h.dcaHigh), borderColor: colors.dcaHigh, borderDash: [2,2], fill: false, tension: 0.1, pointRadius: 0, hidden: true }
            ];

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets = datasets;
                chartInstance.update();
            } else {
                const ctx = document.getElementById('myChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        scales: { y: { ticks: { callback: function(val) { return "฿" + (val/1000000).toFixed(1) + "M"; } } } },
                        plugins: { tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + fmtTHB(context.raw); } } } }
                    }
                });
            }
        }

        // 6. Initialization
        document.getElementById('dcaSlider').addEventListener('input', updateUI);
        
        (async function init() {
            vooData = await fetchAndParseData();
            updateUI();
        })();
    </script>
</body>
</html>
