    <!-- Logic System -->
    <script>
        // 1. Data Parser: ระบบแปลง CSV ของ Yahoo ให้เป็นข้อมูลรายเดือน
        function parseYahooData(csvString) {
            const lines = csvString.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split(',');
            const dateIdx = headers.indexOf('Date');
            const openIdx = headers.indexOf('Open');
            const highIdx = headers.indexOf('High');
            const lowIdx = headers.indexOf('Low');
            const adjCloseIdx = headers.indexOf('Adj Close');

            let monthly = {};

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length < 5 || row[openIdx] === 'null' || !row[dateIdx]) continue;

                const dateStr = row[dateIdx];
                const monthLabel = dateStr.substring(0, 7); // YYYY-MM
                const month = dateStr.substring(5, 7);
                
                const open = parseFloat(row[openIdx]);
                const high = parseFloat(row[highIdx]);
                const low = parseFloat(row[lowIdx]);
                const close = parseFloat(row[adjCloseIdx]); // ใช้ Adj Close เพราะรวมปันผลแล้ว

                if (!monthly[monthLabel]) {
                    monthly[monthLabel] = {
                        date: monthLabel,
                        isFirstOfYear: month === '01',
                        open: open,
                        high: high,
                        low: low,
                        close: close
                    };
                } else {
                    monthly[monthLabel].high = Math.max(monthly[monthLabel].high, high);
                    monthly[monthLabel].low = Math.min(monthly[monthLabel].low, low);
                    monthly[monthLabel].close = close; 
                }
            }
            return Object.values(monthly);
        }

        const vooData = parseYahooData(rawYahooCSV);

        // 2. State & Formatters
        const fmtTHB = (n) => "฿" + Math.round(n).toLocaleString("th-TH");
        const colors = { lumpSum: '#8B5CF6', dcaFirst: '#3B82F6', dcaLow: '#10B981', dcaHigh: '#EF4444' };
        let chartInstance = null;

        // 3. Core Backtest Engine
        function runBacktest(yearlyDca) {
            const monthlyDca = yearlyDca / 12;
            let history = [];
            
            let pLump = { shares: 0, cost: 0 };
            let pFirst = { shares: 0, cost: 0 };
            let pLow = { shares: 0, cost: 0 };
            let pHigh = { shares: 0, cost: 0 };

            vooData.forEach(d => {
                if (d.isFirstOfYear) {
                    pLump.shares += yearlyDca / d.open;
                    pLump.cost += yearlyDca;
                }
                
                pFirst.shares += monthlyDca / d.open;
                pFirst.cost += monthlyDca;

                pLow.shares += monthlyDca / d.low;
                pLow.cost += monthlyDca;

                pHigh.shares += monthlyDca / d.high;
                pHigh.cost += monthlyDca;

                history.push({
                    date: d.date,
                    cost: pFirst.cost,
                    lumpSum: pLump.shares * d.close,
                    dcaFirst: pFirst.shares * d.close,
                    dcaLow: pLow.shares * d.close,
                    dcaHigh: pHigh.shares * d.close
                });
            });

            return { history, totalCost: pFirst.cost };
        }

        // 4. UI Updater
        function updateUI() {
            const yearlyDca = Number(document.getElementById('dcaSlider').value);
            document.getElementById('yearlyText').innerText = fmtTHB(yearlyDca) + " / ปี";
            document.getElementById('monthlyText').innerText = "ตกเดือนละ " + fmtTHB(yearlyDca/12);

            if(vooData.length === 0) {
                alert("กรุณาใส่ข้อมูล CSV ของ Yahoo ให้ถูกต้อง");
                return;
            }

            const { history, totalCost } = runBacktest(yearlyDca);
            const last = history[history.length - 1];
            document.getElementById('chartTitle').innerText = \`การเติบโตของพอร์ตเทียบกับต้นทุน (ทุนรวม: \${fmtTHB(totalCost)})\`;

            // วาด Cards
            const results = [
                { name: "ซื้อจุดต่ำสุดทุกเดือน", val: last.dcaLow, c: colors.dcaLow, desc: "จับจังหวะแบบพระเจ้า" },
                { name: "ทุ่มก้อนเดียวต้นปี", val: last.lumpSum, c: colors.lumpSum, desc: "เงินก้อนพร้อมตั้งแต่ ม.ค." },
                { name: "DCA ต้นเดือนปกติ", val: last.dcaFirst, c: colors.dcaFirst, desc: "หลับตาซื้อทุกวันที่ 1" },
                { name: "ซื้อยอดดอยทุกเดือน", val: last.dcaHigh, c: colors.dcaHigh, desc: "ซวยจัด ซื้อแพงสุดตลอด" }
            ].sort((a, b) => b.val - a.val);

            let cardsHTML = '';
            results.forEach((r, idx) => {
                const profit = r.val - totalCost;
                const percent = ((profit / totalCost) * 100).toFixed(2);
                const pColor = profit >= 0 ? 'text-green-600' : 'text-red-600';
                cardsHTML += \`
                    <div class="bg-white rounded-xl p-5 shadow-sm border-t-4" style="border-color: \${r.c}">
                        <div class="text-xs font-bold text-slate-500 mb-1">อันดับ \${idx+1}: \${r.name}</div>
                        <div class="text-xl font-black text-slate-800 my-2">\${fmtTHB(r.val)}</div>
                        <div class="text-sm font-bold \${pColor}">กำไร \${fmtTHB(profit)} (+\${percent}%)</div>
                        <div class="text-xs text-slate-400 mt-2">\${r.desc}</div>
                    </div>
                \`;
            });
            document.getElementById('summaryCards').innerHTML = cardsHTML;

            // วาด Chart
            const labels = history.map(h => h.date);
            const datasets = [
                { label: 'ต้นทุนสะสม', data: history.map(h => h.cost), borderColor: '#94A3B8', borderDash: [5,5], fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'Lump Sum (ต้นปี)', data: history.map(h => h.lumpSum), borderColor: colors.lumpSum, fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'DCA (ต้นเดือน)', data: history.map(h => h.dcaFirst), borderColor: colors.dcaFirst, fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'DCA (ต่ำสุดของเดือน)', data: history.map(h => h.dcaLow), borderColor: colors.dcaLow, borderDash: [2,2], fill: false, tension: 0.1, pointRadius: 0 },
                { label: 'DCA (สูงสุดของเดือน)', data: history.map(h => h.dcaHigh), borderColor: colors.dcaHigh, borderDash: [2,2], fill: false, tension: 0.1, pointRadius: 0 }
            ];

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets = datasets;
                chartInstance.update();
            } else {
                const ctx = document.getElementById('myChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        scales: { y: { ticks: { callback: function(val) { return "฿" + (val/1000000).toFixed(1) + "M"; } } } },
                        plugins: { tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + fmtTHB(context.raw); } } } }
                    }
                });
            }
        }

        // 5. Event Listeners
        document.getElementById('dcaSlider').addEventListener('input', updateUI);
        
        // Initial Render
        updateUI();
    </script>
</body>
</html>
